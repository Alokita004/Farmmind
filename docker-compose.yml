version: '3.9'

services:
  farmmind-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: farmmind-api
    ports:
      - "8000:8000"
    environment:
      APP_NAME: FarmMind
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://farmmind:farmmind@postgres:5432/farmmind
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: mock
      VECTOR_DB_PATH: /app/data/chroma
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app

  postgres:
    image: postgres:16
    container_name: farmmind-postgres
    environment:
      POSTGRES_DB: farmmind
      POSTGRES_USER: farmmind
      POSTGRES_PASSWORD: farmmind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: farmmind-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
